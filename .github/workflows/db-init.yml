name: DB - Seed Database (one-time)

# Manual trigger only.
#
# Does NOT use SSM Send-Command to run mysql on an existing instance - AWS
# Academy's LabRole generally can't register instances as SSM Managed
# Instances, so that approach fails with InvalidInstanceId even though other
# SSM calls (get-parameter) work fine from the instance's own role.
#
# Instead: the seeding logic lives in user_data.sh.tftpl and runs on instance
# boot, guarded by an S3 marker so it's a no-op after the first successful
# run. This job uploads schema.sql, forces one ASG instance to relaunch (which
# re-runs user_data.sh), then polls S3 for the marker to confirm it worked.
#
# Heads up: this briefly takes the app below its normal capacity while the
# replacement instance boots (dnf update + package installs + seed, typically
# a few minutes) - fine for a one-time coursework seed, not something to run
# repeatedly against a "live" demo without expecting a short dip.
on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  APP_TAG: assignment-event-ticketing
  ASG_NAME: assignment-asg
  SCHEMA_KEY: db-init/schema.sql
  SEED_MARKER_KEY: db-init/.seeded
  POLL_TIMEOUT_SECONDS: 480

jobs:
  seed:
    name: Force a relaunch to seed RDS via user_data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS Academy Learner Lab credentials expire every ~3-4 hours and rotate
      # per session - refresh these 3 repo secrets before running this workflow.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # Resolve the bucket name from Terraform state rather than hardcoding it,
      # so it stays in sync with the account-ID-suffixed name Terraform created.
      - name: Resolve S3 bucket from Terraform output
        working-directory: infra/envs/sandbox
        run: |
          terraform init -input=false
          echo "SCHEMA_BUCKET=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_ENV"

      - name: Clear any stale seed marker
        run: |
          aws s3 rm "s3://${{ env.SCHEMA_BUCKET }}/${{ env.SEED_MARKER_KEY }}" 2>/dev/null || true

      - name: Upload schema.sql and sample images to S3
        run: |
          aws s3 cp event-ticketing/schema.sql "s3://${{ env.SCHEMA_BUCKET }}/${{ env.SCHEMA_KEY }}"
          aws s3 sync event-ticketing/uploads/ "s3://${{ env.SCHEMA_BUCKET }}/uploads/" \
            --exclude "index.html"

      - name: Identify current instance and force a relaunch
        run: |
          set -euo pipefail

          OLD_ID=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`]|[0].InstanceId' \
            --output text)

          if [ -z "$OLD_ID" ] || [ "$OLD_ID" == "None" ]; then
            echo "No InService instance found in ${{ env.ASG_NAME }}. Is the ASG scaled up and healthy?" >&2
            exit 1
          fi

          echo "Current instance: $OLD_ID - terminating so the ASG launches a replacement running the updated user_data."
          aws autoscaling terminate-instance-in-auto-scaling-group \
            --instance-id "$OLD_ID" \
            --no-should-decrement-desired-capacity

          echo "OLD_ID=$OLD_ID" >> "$GITHUB_ENV"

      - name: Wait for the replacement instance to be healthy
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + ${{ env.POLL_TIMEOUT_SECONDS }}))

          while [ $SECONDS -lt $DEADLINE ]; do
            NEW_ID=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "${{ env.ASG_NAME }}" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService' && InstanceId!='${OLD_ID}']|[0].InstanceId" \
              --output text)

            if [ -n "$NEW_ID" ] && [ "$NEW_ID" != "None" ]; then
              echo "Replacement instance $NEW_ID is InService."
              exit 0
            fi

            echo "Waiting for replacement instance..."
            sleep 10
          done

          echo "Timed out waiting for a new InService instance." >&2
          exit 1

      - name: Poll S3 for the seed-complete marker
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + ${{ env.POLL_TIMEOUT_SECONDS }}))

          while [ $SECONDS -lt $DEADLINE ]; do
            if aws s3api head-object --bucket "${{ env.SCHEMA_BUCKET }}" --key "${{ env.SEED_MARKER_KEY }}" >/dev/null 2>&1; then
              echo "Seed marker found - database seeded successfully."
              exit 0
            fi
            echo "Waiting for seed marker..."
            sleep 10
          done

          echo "Timed out waiting for the seed marker. The instance may still be booting (dnf update can be slow), or the seed step failed - check /var/log/cloud-init-output.log on the instance via the EC2 console (Instance Connect) or CloudWatch if configured." >&2
          exit 1
